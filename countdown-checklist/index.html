<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>1200–961 Checklist</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f7fb;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d8e0ec;
      --accent: #176b52;
      --accent-soft: #dff5ec;
      --checked: #eef1f5;
      --shadow: 0 8px 26px rgba(23, 32, 51, 0.10);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button, input { font: inherit; }

    .toolbar {
      position: sticky;
      z-index: 10;
      top: 0;
      padding: max(12px, env(safe-area-inset-top)) 14px 12px;
      border-bottom: 1px solid rgba(216, 224, 236, 0.95);
      background: rgba(244, 247, 251, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .toolbar-inner {
      width: min(680px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.1rem, 4.8vw, 1.45rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .progress {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .clear-button {
      min-height: 48px;
      flex: 0 0 auto;
      padding: 0 17px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 5px 14px rgba(23, 107, 82, 0.22);
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
    }

    .clear-button:disabled {
      background: #a9b3c2;
      box-shadow: none;
      cursor: default;
      opacity: 0.72;
    }

    main {
      width: min(680px, 100%);
      margin: 0 auto;
      padding: 14px 14px max(32px, env(safe-area-inset-bottom));
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .item {
      position: relative;
      min-height: 76px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 17px;
      padding: 12px 17px;
      border: 2px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(23, 32, 51, 0.04);
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: background 140ms ease, border-color 140ms ease, opacity 140ms ease, transform 80ms ease;
    }

    .item:active { transform: scale(0.992); }

    .item:focus-within,
    .cleared-item:focus-visible {
      outline: 4px solid rgba(23, 107, 82, 0.20);
      outline-offset: 2px;
    }

    .item-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .bubble {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border: 3px solid #97a5b7;
      border-radius: 50%;
      background: #fff;
      color: transparent;
      font-size: 1.42rem;
      line-height: 1;
      font-weight: 900;
    }

    .number {
      font-size: 1.5rem;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.035em;
    }

    .item.is-checked {
      border-color: #d7dde5;
      background: var(--checked);
      color: #7b8492;
      box-shadow: none;
    }

    .item.is-checked .bubble {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .item.is-checked .number { text-decoration: line-through; }

    .empty {
      display: none;
      margin: 18px 0;
      padding: 28px 20px;
      border: 2px dashed var(--line);
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 255, 255, 0.55);
    }

    .cleared-panel {
      margin-top: 26px;
      border: 2px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .cleared-panel summary {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 17px;
      cursor: pointer;
      font-weight: 800;
      list-style: none;
      touch-action: manipulation;
    }

    .cleared-panel summary::-webkit-details-marker { display: none; }

    .cleared-panel summary::after {
      content: "⌄";
      margin-left: auto;
      color: var(--muted);
      font-size: 1.25rem;
      transition: transform 150ms ease;
    }

    .cleared-panel[open] summary::after { transform: rotate(180deg); }

    .count-badge {
      min-width: 34px;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--checked);
      color: var(--muted);
      text-align: center;
      font-size: 0.88rem;
    }

    .cleared-content {
      padding: 0 12px 12px;
      border-top: 1px solid var(--line);
    }

    .restore-note {
      margin: 12px 4px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .cleared-item {
      margin-top: 9px;
      appearance: none;
      text-align: left;
      color: #7b8492;
    }

    .cleared-item .bubble {
      border-color: #7b8492;
      background: #7b8492;
      color: #fff;
    }

    .cleared-item .number { text-decoration: line-through; }

    .cleared-empty {
      padding: 18px 4px 8px;
      color: var(--muted);
      text-align: center;
    }

    .status {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 20;
      max-width: calc(100% - 28px);
      padding: 11px 16px;
      border-radius: 999px;
      background: #172033;
      color: #fff;
      box-shadow: var(--shadow);
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .status.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 420px) {
      .toolbar-inner { align-items: stretch; }
      .clear-button { padding-inline: 14px; }
      .item { min-height: 80px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-inner">
      <div>
        <h1>Number Checklist</h1>
        <p class="progress"><strong id="remainingCount">240</strong> remaining · <span id="checkedCount">0</span> checked</p>
      </div>
      <button class="clear-button" id="clearChecked" type="button" disabled>Clear checked</button>
    </div>
  </header>

  <main>
    <section class="list" id="activeList" aria-label="Number checklist"></section>
    <p class="empty" id="emptyState">Everything has been cleared.</p>

    <details class="cleared-panel" id="clearedPanel">
      <summary>
        <span>Cleared numbers</span>
        <span class="count-badge" id="clearedCount">0</span>
      </summary>
      <div class="cleared-content">
        <p class="restore-note" id="restoreNote">Tap a cleared number to put it back in the main list.</p>
        <div class="list" id="clearedList"></div>
        <p class="cleared-empty" id="clearedEmpty">Nothing cleared yet.</p>
      </div>
    </details>
  </main>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const START = 1200;
      const END = 961;
      const STORAGE_KEY = "number-checklist-1200-961-v1";
      const allNumbers = Array.from({ length: START - END + 1 }, (_, index) => START - index);

      const activeList = document.getElementById("activeList");
      const clearedList = document.getElementById("clearedList");
      const clearButton = document.getElementById("clearChecked");
      const remainingCount = document.getElementById("remainingCount");
      const checkedCount = document.getElementById("checkedCount");
      const clearedCount = document.getElementById("clearedCount");
      const emptyState = document.getElementById("emptyState");
      const clearedEmpty = document.getElementById("clearedEmpty");
      const restoreNote = document.getElementById("restoreNote");
      const status = document.getElementById("status");

      let checked = new Set();
      let cleared = new Set();
      let statusTimer;

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          const valid = new Set(allNumbers);
          checked = new Set((saved.checked || []).filter(number => valid.has(number)));
          cleared = new Set((saved.cleared || []).filter(number => valid.has(number)));
          cleared.forEach(number => checked.delete(number));
        } catch (_) {
          checked = new Set();
          cleared = new Set();
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            checked: [...checked],
            cleared: [...cleared]
          }));
        } catch (_) {
          // The checklist still works if browser storage is unavailable.
        }
      }

      function activeRow(number) {
        const isChecked = checked.has(number);
        return `
          <label class="item${isChecked ? " is-checked" : ""}" data-number="${number}">
            <input class="item-input" type="checkbox" ${isChecked ? "checked" : ""} aria-label="Number ${number}">
            <span class="bubble" aria-hidden="true">✓</span>
            <span class="number">${number}</span>
          </label>`;
      }

      function clearedRow(number) {
        return `
          <button class="item cleared-item" type="button" data-restore="${number}" aria-label="Restore number ${number}">
            <span class="bubble" aria-hidden="true">✓</span>
            <span class="number">${number}</span>
          </button>`;
      }

      function render() {
        const active = allNumbers.filter(number => !cleared.has(number));
        const archived = allNumbers.filter(number => cleared.has(number));

        activeList.innerHTML = active.map(activeRow).join("");
        clearedList.innerHTML = archived.map(clearedRow).join("");

        remainingCount.textContent = String(active.length);
        checkedCount.textContent = String(checked.size);
        clearedCount.textContent = String(cleared.size);
        clearButton.disabled = checked.size === 0;
        emptyState.style.display = active.length ? "none" : "block";
        clearedEmpty.style.display = archived.length ? "none" : "block";
        restoreNote.style.display = archived.length ? "block" : "none";
      }

      function announce(message) {
        clearTimeout(statusTimer);
        status.textContent = message;
        status.classList.add("show");
        statusTimer = setTimeout(() => status.classList.remove("show"), 1700);
      }

      activeList.addEventListener("change", event => {
        const input = event.target.closest(".item-input");
        if (!input) return;

        const row = input.closest("[data-number]");
        const number = Number(row.dataset.number);
        if (input.checked) checked.add(number);
        else checked.delete(number);

        row.classList.toggle("is-checked", input.checked);
        checkedCount.textContent = String(checked.size);
        clearButton.disabled = checked.size === 0;
        saveState();
      });

      clearButton.addEventListener("click", () => {
        const amount = checked.size;
        checked.forEach(number => cleared.add(number));
        checked.clear();
        saveState();
        render();
        announce(`${amount} ${amount === 1 ? "number" : "numbers"} moved to Cleared`);
      });

      clearedList.addEventListener("click", event => {
        const row = event.target.closest("[data-restore]");
        if (!row) return;

        const number = Number(row.dataset.restore);
        cleared.delete(number);
        saveState();
        render();
        announce(`${number} restored`);
      });

      loadState();
      render();
    })();
  </script>
</body>
</html>
